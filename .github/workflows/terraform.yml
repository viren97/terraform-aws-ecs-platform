name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - stack
          - modules/network
          - modules/alb
          - modules/ecs-cluster
          - modules/ecs-service
          - modules/ecr
          - modules/rds-postgres
          - modules/elasticache-redis
          - modules/msk-serverless
          - modules/s3-bucket
          - modules/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true # report-only; see README "Security scanning"

  # Plan against a real account using GitHub OIDC (no long-lived AWS keys).
  # Enabled once the AWS_PLAN_ROLE_ARN repository variable is set.
  plan:
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: [fmt, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform -chdir=stack init -input=false -backend-config=../envs/${{ matrix.env }}.s3.tfbackend
      - run: terraform -chdir=stack plan -input=false -lock=false -var-file=../envs/${{ matrix.env }}.tfvars -no-color
